<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:D;src:url(../../assets/fonts/newsreader-var-latin.woff2);font-weight:200 800}
@font-face{font-family:U;src:url(../../assets/fonts/inter-d8ebd1-100_900.woff2);font-weight:100 900}
:root{--paper:#F5F3F0;--ink:#0C0B0A;--ink2:#6F6A64;--acc:#D2401A;--card:#FDFCFA}
body{margin:0;background:#E9E6E1;font-family:U;padding:40px;width:1880px}
h1{font:700 34px U;margin:0 0 6px}.sub{font:400 18px U;color:#555;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(5,344px);gap:30px 32px}
.f{width:344px}.ph{width:344px;height:611px;position:relative;overflow:hidden;border-radius:18px;background:var(--paper);box-shadow:0 10px 30px -10px rgba(0,0,0,.3)}
.dark{background:radial-gradient(120% 70% at 90% 105%,#5a1a0b 0%,#2a0d06 35%,#0C0B0A 70%)}
.lab{font:700 15px U;margin-top:10px}.lab span{color:var(--acc)}.d{font:400 13px/1.35 U;color:#444;margin-top:3px}
.cap{position:absolute;left:0;right:0;top:73%;text-align:center;font:800 15px U;color:#fff;-webkit-text-stroke:3px #111;paint-order:stroke fill}
.ser{position:absolute;font-family:D;font-weight:340;color:var(--ink);white-space:nowrap}
.a{color:var(--acc)}.px{position:absolute}
.caret{display:inline-block;width:2px;height:.9em;background:var(--acc);vertical-align:-.1em;margin-left:2px}
.box{position:absolute;background:#fff;border-radius:12px;box-shadow:0 8px 24px -8px rgba(0,0,0,.18)}
.dot{display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--acc);vertical-align:-.04em;margin:0 .12em}
.pill{display:inline-block;font:500 11px U;padding:5px 10px;border-radius:20px;background:#ECE7E1;color:var(--ink)}
.tile{display:inline-block;width:58px;height:30px;border-radius:5px;background:linear-gradient(135deg,#d9d2ca,#c9bfb5);margin-right:5px}
.card{position:absolute;background:var(--card);border-radius:12px;padding:12px;box-shadow:0 14px 40px -10px rgba(0,0,0,.6)}
.ct{font:600 11px U;color:var(--ink)}.chk{display:flex;align-items:center;gap:8px;font:500 11.5px U;color:var(--ink);padding:7px 0;border-bottom:1px solid #eee}
.cb{width:14px;height:14px;border-radius:4px;border:1.5px solid #bbb;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.cb.on{background:var(--acc);border-color:var(--acc)}
</style></head><body>
<h1>Growlatics — "Be the name AI says." · storyboard (key frames, 9:16)</h1>
<div class="sub">30.0 s · 90.8 BPM synth score (bar = 2.64 s) · Newsreader serif + Inter · accent #D2401A · Act 3 dark #0C0B0A · captions shown at real relative size</div>
<div class="grid" id="g"></div>
<script>
const R=(s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(7);
const px=(n)=>{let h='';const c=['#D2401A','#0C0B0A','#C0B8B0','#E4DED7','#A83216'];for(let i=0;i<n;i++){const w=[3,4,6,9,14][Math.floor(R()*5)];h+=`<div class=px style="left:${R()*330}px;top:${R()*600}px;width:${w}px;height:${w*(R()<.3?2:1)}px;background:${c[Math.floor(R()*5)]}"></div>`}return h};
const bars=(s,c='#D2401A')=>`<svg width="${19*s}" height="${20*s}" viewBox="0 0 19 20">${[[0,14,6],[4,10,10],[8,6,14],[12,3,17],[16,0,20]].map(([x,y,h])=>`<rect x=${x} y=${y} width=3 height=${h} rx=.86 fill="${c}"/>`).join('')}</svg>`;
const F=[
['1','0.0–2.6s','Act 1 hook',`${px(26)}<div class=ser style="left:58px;top:250px;font-size:50px">enough<span class=a>.</span><span class=caret></span></div><div class=cap>Google was enough.</div>`,'Serif words type on one at a time: Google → was → enough. Pixel squares snap in and out on half-beats.'],
['2','2.6–3.6s','(once)',`${px(22)}<div class=ser style="left:96px;top:250px;font-size:50px">(once)<span class=caret></span></div><div class=cap>Once.</div>`,'Small typed beat, caret blinks.'],
['3','3.6–6.0s','Fast run',`${px(24)}<div class=ser style="left:60px;top:268px;font-size:24px">Reviews were enough<span class=a>.</span></div><div class=cap>Reviews were enough.</div>`,'Ranking → Reviews → A website was enough. Hard swap per line, squares re-scatter.'],
['4','6.0–8.6s','AI chat box',`${px(10)}<div class=box style="left:22px;top:248px;width:300px;height:56px"><div class=ser style="left:14px;top:14px;font-size:21px">Who's the best <b style="font-weight:500">roofer</b> near me?<span class=caret></span></div></div><div class=cap>For everything.</div>`,'Types "Who\'s the best plumber near me?" then the trade swaps: plumber → dentist → salon → roofer → lawyer.'],
['5','8.6–11.2s','Question wall',`<div style="position:absolute;top:70px;left:0;right:0;text-align:center;font:340 20px/1.55 D;color:var(--ink)">${['Who fixes leaks fast <i class=dot></i> near me?','Best family dentist <i class=dot></i> open Saturday?','Most trusted roofer <i class=dot></i> in town?','Who does <i class=dot></i> same-day repairs?','Which salon <i class=dot></i> has the best reviews?','Is there a <i class=dot></i> lawyer open now?','Who is the <i class=dot></i> go-to vet here?','Best <i class=dot></i> HVAC near me tonight?','Who\'s the most <i class=dot></i> reliable mechanic?','Where <i class=dot></i> can I get braces fast?','Who has the <i class=dot></i> best kids dentist?','Is it worth <i class=dot></i> calling a pro?'].join('<br>')}</div><div class=cap>Urgent questions.</div>`,'Centred serif questions scroll up. Accent dots pop on the beat.'],
['6','11.2–13.2s','Big statement',`<div style="position:absolute;inset:0;filter:blur(5px);opacity:.25;font:340 20px/1.55 D;text-align:center;padding-top:60px">Who fixes leaks fast near me?<br>Best family dentist open Saturday?<br>Most trusted roofer in town?<br>Who does same-day repairs?<br>Which salon has the best reviews?</div><div class=ser style="left:40px;top:170px;font-size:64px;line-height:1.02;font-weight:330">Your<span class=a>.</span><br>Next<span class=a>.</span><br>Customer<span class=a>.</span></div><div class=cap>was built to answer.</div>`,'Your. Next. Customer. One heavy rise per beat over the blurred wall.'],
['7','13.2–18.5s','AI answer, you fall out',`<div class=box style="right:16px;top:60px;padding:8px 12px;font:500 11px U;background:#F3E3DC;border-radius:10px">Who's the best plumber near me?</div><div style="position:absolute;left:26px;top:110px;font:400 11px U;color:#555">Here are my top picks:</div>${['Competitor A','Competitor B','Competitor C'].map((n,i)=>`<div style="position:absolute;left:26px;top:${138+i*70}px"><span style="font:500 13px U;color:#777">${i+1}.</span> <span class=pill style="${i==0?'background:#0C0B0A;color:#fff':''}">${n}</span><div style="margin:7px 0 0 16px"><span class=tile></span><span class=tile></span><span class=tile></span></div></div>`).join('')}<div style="position:absolute;left:44px;top:388px;transform:rotate(6deg);opacity:.45"><span class=pill style="background:var(--acc);color:#fff">Your Business</span></div><div class=cap>someone else's is.</div>`,'Answer lists Competitor A, B, C. The "Your Business" chip slides down and fades out on "someone else\'s is."'],
['8','18.5–23.1s','Act 3: dashboards',`<div class=card style="left:22px;top:70px;width:276px"><div class=ct>AI Visibility Score</div><svg width=276 height=120 viewBox="0 0 276 120"><path d="M58 108 A80 80 0 0 1 218 108" stroke="#E7E2DC" stroke-width=16 fill=none stroke-linecap=round /><path d="M58 108 A80 80 0 0 1 196 58" stroke="#D2401A" stroke-width=16 fill=none stroke-linecap=round /><text x=138 y=100 text-anchor=middle font-family=U font-weight=700 font-size=26 fill="#0C0B0A">78%</text></svg></div><div class=card style="left:22px;top:250px;width:276px"><div class=ct>Who AI recommends</div><svg width=276 height=110 viewBox="0 0 276 110"><polyline points="5,40 70,45 140,52 205,60 270,66" stroke="#B9B1A8" stroke-width=2 fill=none /><polyline points="5,55 70,50 140,60 205,70 270,78" stroke="#8A837B" stroke-width=2 fill=none /><polyline points="5,95 70,85 140,60 205,30 270,12" stroke="#D2401A" stroke-width=3 fill=none /><circle cx=270 cy=12 r=4 fill="#D2401A"/><text x=196 y=24 font-family=U font-size=9 fill="#D2401A" font-weight=600>Your Business</text></svg></div><div class=cap style="-webkit-text-stroke:0;text-shadow:0 2px 6px #000">who AI recommends,</div>`,'Hard cut + whoosh on the bar. Gauge sweeps 12% → 78%. Your line climbs past Competitors A, B, C.'],
['9','23.1–26.4s','Fix checklist',`<div class=card style="left:30px;top:150px;width:262px"><div class=ct style="margin-bottom:6px">Fixes</div>${[['Google profile fixed',1],['Reviews flowing',1],['Website AI-ready',1],['Listings matched',0]].map(([t,on])=>`<div class=chk><span class="cb ${on?'on':''}">${on?'✓':''}</span>${t}</div>`).join('')}</div><div class=cap style="-webkit-text-stroke:0;text-shadow:0 2px 6px #000">Be trusted.</div>`,'Card rises. One tick per beat, with a tick SFX.'],
['10','26.4–30.0s','End card',`<div class=ser style="left:34px;top:205px;font-size:36px;color:#F5F3F0">Be the name AI says<span class=a>.</span></div><div style="position:absolute;left:34px;top:300px;display:flex;align-items:flex-end;gap:10px">${bars(1.6)}<span style="font:700 30px U;color:#F5F3F0;letter-spacing:-.02em">Growlatics</span></div><div style="position:absolute;left:34px;top:352px;font:500 15px U;color:#C0B8B0">growlatics.us</div><div class=cap style="-webkit-text-stroke:0;text-shadow:0 2px 6px #000">Growlatics.</div>`,'Line rises on the bar, logo bars build one by one, URL lands. Music lifts, 1 s fade-out.'],
];
document.getElementById('g').innerHTML=F.map(([n,t,name,h,d],i)=>`<div class=f><div class="ph ${i>=7?'dark':''}">${h}</div><div class=lab><span>${n}</span> · ${t} · ${name}</div><div class=d>${d}</div></div>`).join('');
</script></body></html>
