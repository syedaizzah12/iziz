<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>motion reel</title>
<style>
  /* One display face, one UI face. Point these at the brand's real files in assets/fonts/ (capture.mjs lists them). */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/newsreader-var-latin.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/inter-d8ebd1-100_900.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* style guide tokens: ONE accent unless the brief says otherwise */
    --bg: #F5F3F0; --ink: #0C0B0A; --ink-2: #3A3530; --ink-3: #6F6A64; --ink-4: #A39D96; --line: #E4DED7; --accent: #D2401A; --accent-deep: #A83216; --accent-soft: #F6E2DA; --card: #FDFCFA; --dark: #0C0B0A;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', Georgia, serif; font-weight: 340; letter-spacing: -0.015em; font-optical-sizing: auto;
             line-height: 1.0; white-space: nowrap; }
  .display i, .ser i { font-style: normal; color: var(--accent); }
  .ser { font-family: 'Display', Georgia, serif; font-weight: 340; letter-spacing: -0.01em; white-space: nowrap; }
  .ui { font-family: 'UI', Arial, sans-serif; }
  .cap { position: absolute; left: 0; width: 1080px; text-align: center; font: 800 46px/1.1 'UI', Arial, sans-serif; color: #fff;
         letter-spacing: -0.01em; -webkit-text-stroke: 10px #0C0B0A; paint-order: stroke fill; white-space: nowrap; }
  /* a line is a mask: words rise through it. Padding keeps descenders; start words >= 140% below so no sliver shows. */
  .line { position: absolute; overflow: hidden; padding: 0.08em 0.04em 0.18em; margin: -0.08em -0.04em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .card { position: absolute; background: var(--card); border-radius: 28px;
          box-shadow: 0 2px 6px rgba(0,0,0,.05), 0 30px 80px -20px rgba(0,0,0,.22); }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="captions.js"></script>
<script src="film.js"></script>
</body>
</html>
