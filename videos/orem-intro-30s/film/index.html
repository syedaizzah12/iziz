<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orem — introductory reel</title>
<style>
  /* One display face, one UI face. Point these at the brand's real files in assets/fonts/ (capture.mjs lists them). */
  /* Orem's own faces (getorem.com loads them from Google Fonts, SIL OFL): Newsreader for H1/H2, Inter for UI. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/newsreader.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* style guide tokens: ONE accent unless the brief says otherwise */
    /* measured from getorem.com :root (docs/style_guide.md). ONE accent: --ov-accent. */
    --bg: #f3f5f4; --ink: #141b21; --ink-2: #46525b; --fog: #7d8790; --line: #e1e7e4; --line2: #cbd4d0;
    --accent: #028090; --accent-soft: #e0f4f6; --accent-bar: #20b8cd; --petrol: #0e5e63; --card: #ffffff;
    --gain: #12805c; --gain-soft: #e2f1ea; --noise: #5e6a74; --noise-soft: #ebeeef; --row: #f1f3f2;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; }
  .display { font-family: 'Display', Georgia, serif; font-weight: 500; letter-spacing: -0.025em;
             line-height: 1.0; white-space: nowrap; }
  .ui { font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; }
  .num { font-family: 'UI', sans-serif; font-variant-numeric: tabular-nums; }
  /* a line is a mask: words rise through it. Padding keeps descenders; start words >= 140% below so no sliver shows. */
  .line { position: absolute; overflow: hidden; padding: 0.08em 0.04em 0.18em; margin: -0.08em -0.04em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .card { position: absolute; background: var(--card); border-radius: 28px; border: 1px solid var(--line);
          box-shadow: 0 2px 6px rgba(20,27,33,.04), 0 40px 90px -30px rgba(20,27,33,.28); }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="film.js"></script>
</body>
</html>
